services:
  # Backend Medusa
  - type: web
    name: medusa-backend
    runtime: node
    plan: starter
    buildCommand: yarn install && yarn build
    startCommand: npx medusa start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medusa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MEDUSA_ADMIN_ONBOARDING_TYPE
        value: default
    healthCheckPath: /health

  # Admin Dashboard (Frontend)
  - type: web
    name: medusa-admin
    runtime: node
    plan: starter
    buildCommand: yarn install && yarn workspace @medusajs/deps build && yarn workspace @medusajs/types build && yarn workspace @medusajs/icons build && yarn workspace @medusajs/ui-preset build && yarn workspace @medusajs/ui build && yarn workspace @medusajs/js-sdk build && yarn workspace @medusajs/admin-shared build && yarn workspace @medusajs/admin-vite-plugin build && yarn workspace @medusajs/dashboard build:preview
    startCommand: cd packages/admin/dashboard && npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_MEDUSA_ADMIN_BACKEND_URL
        fromService:
          name: medusa-backend
          type: web
          property: host
      - key: VITE_AUTH_API_URL
        value: https://medusa-auth.gfiyfougiug.workers.dev

databases:
  - name: medusa-db
    plan: starter
    databaseName: medusa_db
    user: medusa_user

